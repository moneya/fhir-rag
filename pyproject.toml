[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhir-rag"
version = "0.1.0"
description = "Retrieval over FHIR patient records, with recall measured against known ground truth."
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fhir_rag"]
